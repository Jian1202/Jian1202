name: Validate profile SVG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成主页 SVG
        run: node generator/index.js

      - name: 检查生成结果
        run: git diff --exit-code -- assets/profile.svg
